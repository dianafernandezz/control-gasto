<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos Personales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <h2 class="mb-4 text-center text-primary">
            <i class="bi bi-wallet2"></i> Panel de Gastos Personales
        </h2>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card bg-success-subtle text-success border-success h-100">
                    <div class="card-body text-center">
                        <h6>Ingresos Totales</h6>
                        <h3 id="lblIngresos">Gs. 0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-danger-subtle text-danger border-danger h-100">
                    <div class="card-body text-center">
                        <h6>Egresos Totales</h6>
                        <h3 id="lblEgresos">Gs. 0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div id="cardSaldo" class="card bg-primary-subtle text-primary border-primary h-100">
                    <div class="card-body text-center">
                        <h6>Saldo Neto</h6>
                        <h3 id="lblSaldo">Gs. 0</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold">Registrar Movimiento</div>
                    <div class="card-body">
                        <form id="formGasto">
                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <input type="text" id="txtDescripcion" class="form-control" required placeholder="Ej. Pasaje, Supermercado, Alquiler">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Monto</label>
                                <div class="input-group">
                                    <span class="input-group-text">₲</span>
                                    <input type="number" id="txtMonto" class="form-control" required placeholder="Ej. 20000">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tipo de Movimiento</label>
                                <select id="cmbTipo" class="form-select">
                                    <option value="EGRESO">Egreso (Gasto)</option>
                                    <option value="INGRESO">Ingreso (Entrada)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Categoría</label>
                                <select id="cmbCategoria" class="form-select">
                                    <option value="Vivienda">Vivienda (Alquiler, Servicios)</option>
                                    <option value="Alimentación">Alimentación (Súper, Despensa)</option>
                                    <option value="Transporte">Transporte (Colectivo, Combustible)</option>
                                    <option value="Ingresos">Ingresos (Sueldo, Extras)</option>
                                    <option value="Otros">Otros Gastos / Ocio</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-dark w-100">Guardar Transacción</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-secondary text-white fw-bold">
                        <i class="bi bi-list-ul me-2"></i> Historial de Movimientos
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col" style="width: 40%;">Descripción</th>
                                    <th scope="col" style="width: 25%;">Categoría</th>
                                    <th scope="col" style="width: 15%;">Tipo</th>
                                    <th scope="col" style="width: 20%;" class="text-end">Monto</th>
                                </tr>
                            </thead>
                            <tbody id="tablaCuerpo">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
